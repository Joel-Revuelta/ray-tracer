{
    fps = 24;
    shutter = { angle = 180.0; samples = 4; };
    camera = (
        { time = 0.0; position = { x = 3.6; y = 3.2; z = 8.0; }; rotation = { x = 0.0; y = 1.2; z = 1.5; }; fieldOfView = 40.0; lensRadius = 0.12; focusDistance = 7.0; },
        { time = 4.0; position = { x = 1.4; y = 2.3; z = 7.2; }; rotation = { x = 0.0; y = 1.3; z = 1.5; }; fieldOfView = 43.0; },
        { time = 8.0; position = { x = -3.0; y = 3.8; z = 7.2; }; rotation = { x = 0.0; y = 1.2; z = 1.8; }; fieldOfView = 41.0; }
    );
    instances = (
        { target = "flowerCenter"; rotation = (
            { time = 0.0; value = { x = 0.0; y = 0.0; z = 0.0; }; },
            { time = 8.0; value = { x = 4.0; y = 30.0; z = 0.0; }; } );
          position = (
            { time = 0.0; value = { x = 0.0; y = 0.7; z = 1.5; }; },
            { time = 4.0; value = { x = 0.0; y = 1.0; z = 1.5; }; },
            { time = 8.0; value = { x = 0.0; y = 0.7; z = 1.5; }; } );
          scale = (
            { time = 0.0; value = { x = 1.55; y = 1.55; z = 1.55; }; },
            { time = 4.0; value = { x = 1.75; y = 1.75; z = 1.75; }; },
            { time = 8.0; value = { x = 1.55; y = 1.55; z = 1.55; }; } ); },
        { target = "flowerLeft"; rotation = (
            { time = 0.0; value = { x = 0.0; y = 35.0; z = 0.0; }; },
            { time = 8.0; value = { x = 5.0; y = 58.0; z = 0.0; }; } ); },
        { target = "flowerRight"; rotation = (
            { time = 0.0; value = { x = 0.0; y = -28.0; z = 0.0; }; },
            { time = 8.0; value = { x = -4.0; y = -8.0; z = 0.0; }; } ); }
    );
    lights = (
        { target = "gardenKey"; intensity = (
            { time = 0.0; value = 11.0; },
            { time = 4.0; value = 16.0; },
            { time = 8.0; value = 11.0; } ); },
        { target = "gardenWarm"; intensity = (
            { time = 0.0; value = 6.0; },
            { time = 4.0; value = 9.0; },
            { time = 8.0; value = 6.0; } ); }
    );
};

