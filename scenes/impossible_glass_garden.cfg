{
    position = { x = 3.6; y = 3.2; z = 8.0; };
    rotation = { x = 0.0; y = 1.2; z = 1.5; };
    fieldOfView = 40.0;
    lensRadius = 0.12;
    focusDistance = 7.0;
};

