# Soft shadows: two spherical area lights illuminate a row of spheres on a
# floor. The light radius controls how soft the penumbrae are.
camera:
{
    position = { x = 0.0; y = 3.0; z = -10.0; };
    rotation = { x = 0.0; y = 0.2; z = 0.0; };
    fieldOfView = 48.0;
};

background:
{
    zenith = { r = 0.02; g = 0.03; b = 0.08; };
    horizon = { r = 0.12; g = 0.16; b = 0.30; };
    ground = { r = 0.01; g = 0.01; b = 0.02; };
    intensity = 1.0;
};

materials:
{
    floor = {
        type = "diffuse";
        ambientReflection = 0.30;
        diffuseReflection = 0.85;
        color = { r = 0.15; g = 0.17; b = 0.24; };
    };
    red = {
        type = "metallic";
        roughness = 0.16;
        color = { r = 0.95; g = 0.16; b = 0.22; };
    };
    jade = {
        type = "diffuse";
        ambientReflection = 0.25;
        diffuseReflection = 0.90;
        color = { r = 0.08; g = 0.75; b = 0.38; };
    };
    cyan = {
        type = "metallic";
        roughness = 0.08;
        color = { r = 0.10; g = 0.85; b = 0.95; };
    };
    glass = {
        type = "dielectric";
        ior = 1.42;
        color = { r = 0.65; g = 0.90; b = 1.0; };
    };
};

primitives:
{
    planes = (
        {
            material = 0;
            position = { x = 0.0; y = -1.0; z = 0.0; };
            normal = { x = 0.0; y = 1.0; z = 0.0; };
        }
    );

    spheres = (
        {
            material = 1;
            r = 1.0;
            position = { x = -2.6; y = 0.0; z = 0.3; };
        },
        {
            material = 2;
            r = 1.0;
            position = { x = 0.0; y = 0.0; z = 0.0; };
        },
        {
            material = 3;
            r = 1.0;
            position = { x = 2.6; y = 0.0; z = 0.3; };
        }
    );
};

lights:
{
    ambient = {
        color = { r = 0.45; g = 0.50; b = 0.65; };
        intensity = 0.08;
    };
    spheres = (
        {
            position = { x = -3.8; y = 4.0; z = -3.0; };
            radius = 1.1;
            color = { r = 1.0; g = 0.70; b = 0.45; };
            intensity = 3.6;
            attenuation = {
                constant = 1.0;
                linear = 0.05;
                quadratic = 0.003;
            };
        },
        {
            position = { x = 3.8; y = 3.4; z = -2.4; };
            radius = 0.9;
            color = { r = 0.40; g = 0.70; b = 1.0; };
            intensity = 2.6;
            attenuation = {
                constant = 1.0;
                linear = 0.05;
                quadratic = 0.003;
            };
        }
    );
};
