# Meshes: OBJ assets with shared geometry, per-instance materials and
# transforms. The same icosphere asset is loaded once and instanced three
# times.
camera:
{
    position = { x = 0.0; y = 3.0; z = -10.0; };
    rotation = { x = 0.0; y = 0.4; z = 0.0; };
    fieldOfView = 48.0;
};

background:
{
    zenith = { r = 0.02; g = 0.03; b = 0.08; };
    horizon = { r = 0.12; g = 0.16; b = 0.30; };
    ground = { r = 0.01; g = 0.01; b = 0.02; };
    intensity = 1.0;
};

materials:
{
    floor = {
        type = "diffuse";
        ambientReflection = 0.30;
        diffuseReflection = 0.85;
        color = { r = 0.20; g = 0.22; b = 0.30; };
    };
    red = {
        type = "metallic";
        roughness = 0.16;
        color = { r = 0.95; g = 0.16; b = 0.22; };
    };
    cyan = {
        type = "metallic";
        roughness = 0.08;
        color = { r = 0.10; g = 0.85; b = 0.95; };
    };
    glass = {
        type = "dielectric";
        ior = 1.42;
        color = { r = 0.65; g = 0.90; b = 1.0; };
    };
    jade = {
        type = "diffuse";
        ambientReflection = 0.25;
        diffuseReflection = 0.90;
        color = { r = 0.08; g = 0.75; b = 0.38; };
    };
    amber = {
        type = "emissive";
        intensity = 0.9;
        color = { r = 1.0; g = 0.55; b = 0.15; };
        emissionColor = { r = 1.0; g = 0.42; b = 0.08; };
    };
};

primitives:
{
    planes = (
        {
            material = 0;
            position = { x = 0.0; y = -1.0; z = 0.0; };
            normal = { x = 0.0; y = 1.0; z = 0.0; };
        }
    );

    meshes = (
        {
            material = 1;
            path = "models/icosphere.obj";
            transform = {
                translate = { x = -2.6; y = 0.35; z = 0.0; };
                scale = 1.35;
            };
        },
        {
            material = 2;
            path = "models/icosphere.obj";
            transform = {
                translate = { x = 0.0; y = 0.55; z = 0.4; };
                rotate = { x = 0.0; y = 30.0; z = 0.0; };
                scale = 0.95;
            };
        },
        {
            material = 3;
            path = "models/icosphere.obj";
            transform = {
                translate = { x = 2.6; y = 0.25; z = -0.2; };
                scale = 0.9;
            };
        },
        {
            material = 4;
            path = "models/torus.obj";
            transform = {
                translate = { x = 0.3; y = -0.30; z = -1.9; };
                scale = 1.35;
            };
        },
        {
            material = 5;
            path = "models/icosphere.obj";
            transform = {
                translate = { x = 0.0; y = 2.0; z = 0.2; };
                scale = 0.32;
            };
        }
    );
};

lights:
{
    ambient = {
        color = { r = 0.45; g = 0.50; b = 0.65; };
        intensity = 0.28;
    };
    directional = {
        position = { x = -0.35; y = -1.0; z = 0.45; };
        color = { r = 1.0; g = 0.96; b = 0.90; };
        intensity = 0.65;
    };
    point = (
        {
            position = { x = -3.4; y = 2.6; z = -3.2; };
            color = { r = 1.0; g = 0.70; b = 0.45; };
            intensity = 1.6;
            attenuation = {
                constant = 1.0;
                linear = 0.05;
                quadratic = 0.003;
            };
        },
        {
            position = { x = 3.6; y = 2.2; z = -2.4; };
            color = { r = 0.40; g = 0.70; b = 1.0; };
            intensity = 1.2;
            attenuation = {
                constant = 1.0;
                linear = 0.05;
                quadratic = 0.003;
            };
        }
    );
};
