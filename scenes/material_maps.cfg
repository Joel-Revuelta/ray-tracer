# Material map study: roughness on brushed metal, normal detail on stone and
# floor, and an emissive checker panel.
camera:
{
    position = { x = 0.0; y = 2.6; z = -8.5; };
    rotation = { x = 0.0; y = 1.2; z = 0.0; };
    fieldOfView = 50.0;
    lensRadius = 0.04;
    focusDistance = 9.0;
};

background:
{
    zenith = { r = 0.015; g = 0.025; b = 0.060; };
    horizon = { r = 0.12; g = 0.13; b = 0.22; };
    ground = { r = 0.010; g = 0.010; b = 0.015; };
    intensity = 0.9;
};

materials:
{
    floor = {
        type = "diffuse";
        ambientReflection = 0.20;
        diffuseReflection = 0.85;
        color = { r = 0.35; g = 0.38; b = 0.45; };
        normalTexture = "textures/normal_bumps.ppm";
    };

    brushed = {
        type = "metallic";
        roughness = 0.45;
        color = { r = 0.95; g = 0.68; b = 0.28; };
        roughnessTexture = "textures/roughness_gradient.ppm";
    };

    stone = {
        type = "diffuse";
        ambientReflection = 0.25;
        diffuseReflection = 0.90;
        color = { r = 0.72; g = 0.48; b = 0.34; };
        normalTexture = "textures/normal_bumps.ppm";
    };

    sign = {
        type = "emissive";
        intensity = 2.0;
        color = { r = 1.0; g = 1.0; b = 1.0; };
        emissionColor = { r = 1.0; g = 0.95; b = 0.85; };
        emissionTexture = "textures/emission_checker.ppm";
    };
};

primitives:
{
    planes = (
        {
            material = 0;
            position = { x = 0.0; y = 0.0; z = 0.0; };
            normal = { x = 0.0; y = 1.0; z = 0.0; };
        }
    );

    spheres = (
        { material = 1; r = 1.25; position = { x = -2.7; y = 1.25; z = 0.0; }; },
        { material = 2; r = 1.00; position = { x = 0.0; y = 1.00; z = 0.0; }; },
        { material = 3; r = 0.62; position = { x = 2.5; y = 1.55; z = 0.0; }; }
    );
};

lights:
{
    ambient = {
        color = { r = 0.55; g = 0.65; b = 1.0; };
        intensity = 0.20;
    };

    point = (
        {
            position = { x = -3.0; y = 5.0; z = -2.0; };
            color = { r = 1.0; g = 0.72; b = 0.42; };
            intensity = 3.2;
            attenuation = { constant = 1.0; linear = 0.04; quadratic = 0.001; };
        },
        {
            position = { x = 3.5; y = 4.0; z = 1.0; };
            color = { r = 0.35; g = 0.60; b = 1.0; };
            intensity = 2.4;
            attenuation = { constant = 1.0; linear = 0.04; quadratic = 0.001; };
        }
    );
};
