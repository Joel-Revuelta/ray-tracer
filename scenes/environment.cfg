# Environment: an equirectangular PPM sky provides the background, reflections
# and path-traced illumination. No directional or point lights are used.
camera:
{
    position = { x = 0.0; y = 1.6; z = -6.5; };
    rotation = { x = 0.0; y = 2.0; z = 0.0; };
    fieldOfView = 45.0;
};

background:
{
    texture = "textures/sky.ppm";
    intensity = 1.0;
};

materials:
{
    floor = {
        type = "metallic";
        roughness = 0.12;
        color = { r = 0.82; g = 0.86; b = 0.92; };
    };
    mirror = {
        type = "metallic";
        roughness = 0.02;
        color = { r = 1.0; g = 1.0; b = 1.0; };
    };
    diffuse = {
        type = "diffuse";
        ambientReflection = 0.25;
        diffuseReflection = 0.90;
        color = { r = 0.12; g = 0.38; b = 0.90; };
    };
    glass = {
        type = "dielectric";
        ior = 1.45;
        color = { r = 0.80; g = 0.95; b = 1.0; };
    };
};

primitives:
{
    planes = (
        {
            material = 0;
            position = { x = 0.0; y = -1.0; z = 0.0; };
            normal = { x = 0.0; y = 1.0; z = 0.0; };
        }
    );

    spheres = (
        {
            material = 1;
            r = 1.0;
            position = { x = -2.4; y = 0.0; z = 0.2; };
        },
        {
            material = 2;
            r = 1.0;
            position = { x = 0.0; y = 0.0; z = 0.4; };
        },
        {
            material = 3;
            r = 0.9;
            position = { x = 2.4; y = -0.1; z = 0.1; };
        }
    );
};

lights:
{
    ambient = {
        color = { r = 0.45; g = 0.50; b = 0.65; };
        intensity = 0.04;
    };
};
