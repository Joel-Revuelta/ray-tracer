# Regression scene for per-triangle material overrides: the mesh fallback is
# diffuse but the left group is metallic. Both renderers must shade and bounce
# with the resolved group material.
camera:
{
    position = { x = 0.0; y = 0.0; z = -6.0; };
    rotation = { x = 0.0; y = 0.0; z = 0.0; };
    fieldOfView = 50.0;
};

background:
{
    zenith = { r = 0.03; g = 0.05; b = 0.12; };
    horizon = { r = 0.35; g = 0.40; b = 0.55; };
    ground = { r = 0.01; g = 0.01; b = 0.02; };
    intensity = 1.0;
};

materials:
{
    fallback = {
        type = "diffuse";
        ambientReflection = 0.2;
        diffuseReflection = 0.9;
        color = { r = 0.75; g = 0.10; b = 0.08; };
    };
    metal = {
        type = "metallic";
        roughness = 0.04;
        color = { r = 0.95; g = 0.72; b = 0.30; };
    };
};

primitives:
{
    meshes = (
        {
            material = 0;
            path = "mixed_material.obj";
            materialGroups = {
                metal = 1;
                diffuse = 0;
            };
        }
    );
};

lights:
{
    ambient = {
        color = { r = 0.5; g = 0.6; b = 1.0; };
        intensity = 0.15;
    };
    point = (
        {
            position = { x = 0.0; y = 1.6; z = -3.0; };
            color = { r = 1.0; g = 0.88; b = 0.70; };
            intensity = 3.0;
            attenuation = { constant = 1.0; linear = 0.04; quadratic = 0.002; };
        }
    );
};
