name: build

on:
  push:
  pull_request:

jobs:
  headless:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libconfig++-dev

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DRAYTRACER_ENABLE_GUI=OFF \
            -DRAYTRACER_ENABLE_CUDA=OFF

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Smoke-test every scene
        run: |
          for scene in scenes/*.cfg; do
            name="$(basename "${scene%.cfg}")"
            ./raytracer --path "$scene" --cli --renderer cpu \
              --width 16 --height 9 --frames 1 \
              --output "/tmp/${name}.ppm"
          done
